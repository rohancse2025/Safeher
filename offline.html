<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SafeHer – Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css?v=16" />
  <style>
    body {
      background: var(--pink-light);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    .offline-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-tile);
      padding: 32px 20px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-sizing: border-box;
    }
    .offline-icon {
      font-size: 54px;
      color: var(--crimson);
      margin-bottom: 12px;
    }
    .offline-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
      margin: 0 0 8px;
    }
    .offline-desc {
      font-size: 13px;
      color: var(--text-gray);
      line-height: 1.5;
      margin: 0 0 24px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <span class="material-symbols-rounded offline-icon">wifi_off</span>
    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-desc">SafeHer cached emergency tools are available, but an internet connection is required to load new maps and online features.</p>
    <button class="btn btn-primary" onclick="window.location.reload()">
      <span class="material-symbols-rounded">refresh</span>Retry
    </button>
  </div>
</body>
</html>
